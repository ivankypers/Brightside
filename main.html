<!doctype html>

  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="./css/normalize.css">

  <link rel="stylesheet" href="./css/style.css">
  <title>Bright Side - Пора перевести твой проект в яркий режим</title>

<body>
  <header class="header">
    <div class="container">
      <div class="row">
        <div class="col-lg-2"><img src="./img/Logo.svg" alt="Brightside" class="header__logo"></div>
        <div class="col-lg-6 d-flex align-items-center">
          <nav class="header__nav">
            <ul class="header__nav-list d-flex align-items-center">
              <li class="header__nav-item"><a href="#" class="header__nav-link">Последние проекты</a></li>
              <li class="header__nav-item"><a href="#" class="header__nav-link">О нас</a></li>
              <li class="header__nav-item"><a href="#" class="header__nav-link">Наше портфолио</a></li>
            </ul>
          </nav>
        </div>
        <div class="col-lg-4 d-flex align-items-center justify-content-end">
          <button class="btn btn-reset header__btn d-flex align-items-center"><span class="header__btn-text">Обсудить проект</span> <img src="./img/openHead.png" alt="OPEN" class="header__btn-icon"></button>
        </div>
      </div>
    </div>
  </header>

  <section class="main">
    <div class="container">
      <div class="row">
        <div class="col-lg-8 main__text">
          <h1 class="main__title animate__animated animate__fadeIn animate__delay-1s">Пора перевести твой проект <br class="main__title-br">
           <span class="main__title-spot">в яркий режим</span></h1>
        </div>
        <div class="col-lg-4">
          <picture class="main__img-wrap">
            <img src="./img/lamp(dark).png" alt="" class="main__img">
          </picture>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-6 main__subtitle-pos ">

          <div class="main__subtitle d-flex align-items-center">
            <a href="#" class="main__subtitle-scroll__link">
              <img src="./img/scrolldown.svg" alt="" class="main__subtitle-scroll">
            </a>

              <div class="text-wrap">
                Лаборатория веб дизайна <br>
                и фронтенд разработки проектов
              </div>
            </div>
        </div>
      </div>
    </div>
  </section>
